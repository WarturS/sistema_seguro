<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Seguro</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="container">

        <section id="loginSection" class="card">

            <h1>Sistema Seguro</h1>

            <p class="subtitle">
                PostgreSQL + Node.js + Neon
            </p>

            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>


        <section id="dashboardSection" class="dashboard hidden">

            <header>

                <div>
                    <h1>Sistema Seguro</h1>
                    <p>Dashboard</p>
                </div>

                <button id="logoutButton">
                    Sair
                </button>

            </header>


            <section class="user-info">

                <h2>Usuário autenticado</h2>

                <p>
                    Nome:
                    <strong id="userName"></strong>
                </p>

                <p>
                    E-mail:
                    <strong id="userEmail"></strong>
                </p>

                <p>
                    Perfil:
                    <strong id="userProfile"></strong>
                </p>

            </section>


            <section class="actions">

                <button id="clientesButton">
                    Listar Clientes
                </button>

                <button id="auditoriaButton">
                    Consultar Auditoria
                </button>

            </section>


            <section>

                <h2>Resultado</h2>

                <pre id="result"></pre>

            </section>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
